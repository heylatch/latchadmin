name: Release

# Push a tag like v0.1.0. The binaries are built here, their hashes listed in SHA256SUMS (first line
# "# latchadmin <version>") and that file is signed with LATCHADMIN_SIGNING_KEY. LatchAdmin installs an update only
# when this signature checks out against the public key built into it (internal/selfupdate).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/heylatch/latchadmin/internal/buildinfo.Version=$VERSION"
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/latchadmin-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/latchadmin
          done
      - name: Hash and sign
        env:
          LATCHADMIN_SIGNING_KEY: ${{ secrets.LATCHADMIN_SIGNING_KEY }}
        run: |
          cd dist
          { echo "# latchadmin $VERSION"; sha256sum latchadmin-*; } > SHA256SUMS
          cd ..
          go run ./tools/sign dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LatchAdmin $VERSION" --generate-notes
